---
# Stands up Argo CD -- the GitOps controller that turns a git repository into
# the cluster's desired state -- in its own `argocd` namespace, exposed on a
# NodePort, with a known admin password and one app-of-apps Application
# pointed at this repository's gitops/bootstrap chart. That Application is
# what deploys the observability stack; nothing in Ansible does any more.
#
# Runs after k8s-cluster-bootstrap.yml: the cluster has to exist, and the
# StorageClass that playbook installs has to be there before the stack's
# volumes can bind. Argo CD itself needs no StorageClass -- it keeps its state
# in Kubernetes objects and a non-persistent Redis cache.
#
# Manual invocation, from the repo root:
#   ansible-playbook -i terraform/inventory.ini ansible/k8s-argocd.yml

# Cluster-scoped, so it runs once from the control plane against admin.conf.
# helm_cli is here because this is now the only playbook that drives helm.
- name: Deploy Argo CD
  hosts: k8s_control
  become: true
  roles:
    - helm_cli
    - role: k8s_argocd
      when: k8s_argocd_enabled | default(true)
