---
# Runs on the Kubernetes nodes. Three things have to line up before a kubelet
# can pull an image tagged {{ containerd_registry_trust_endpoint }}:
# the name has to resolve, containerd has to be told to read certs.d, and the
# certs.d entry has to say "this one is plain HTTP".

- name: Add the registry hostname to the node's /etc/hosts
  ansible.builtin.lineinfile:
    path: "{{ containerd_registry_trust_hosts_file }}"
    regexp: '^\s*\S+\s+{{ containerd_registry_trust_host | regex_escape }}\s*$'
    line: "{{ containerd_registry_trust_address }} {{ containerd_registry_trust_host }}"
    owner: root
    group: root
    mode: "0644"
  when: containerd_registry_trust_manage_hosts_entry

- name: Create the containerd certs.d directory
  ansible.builtin.file:
    path: "{{ containerd_registry_trust_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The directory name has to be the registry exactly as it appears in an image
# reference, port included -- that is the key containerd looks up.
- name: Create the per-registry certs.d directory
  ansible.builtin.file:
    path: "{{ containerd_registry_trust_certs_dir }}/{{ containerd_registry_trust_endpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# containerd re-reads certs.d on each pull, so this alone needs no restart.
- name: Deploy the registry's hosts.toml
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ containerd_registry_trust_certs_dir }}/{{ containerd_registry_trust_endpoint }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"

# containerd.io ships its own config.toml, so the "generate a default config"
# branch in k8s_node_prereqs never fires and the file arrives with every
# plugin setting commented out -- including registry.config_path, which is
# empty by default and means "ignore certs.d entirely".
- name: Read the containerd config
  ansible.builtin.slurp:
    src: "{{ containerd_registry_trust_config_path }}"
  register: containerd_registry_trust_config_slurp

- name: Note whether the config already declares a registry table
  ansible.builtin.set_fact:
    containerd_registry_trust_existing_table: >-
      {{ (containerd_registry_trust_config_slurp.content | b64decode)
         is search('(?m)^\s*\[plugins\..*\.registry\]') }}
    containerd_registry_trust_block_present: >-
      {{ (containerd_registry_trust_config_slurp.content | b64decode)
         is search('containerd_registry_trust') }}

# Two shapes to cope with. containerd.io's shipped config declares no registry
# table at all, so the block goes in whole. A config generated by `containerd
# config default` already declares one, with an empty config_path -- there the
# value is edited in place, because a second table of the same name is a TOML
# duplicate-key error and containerd would refuse to start.
#
# Appending the v3-style plugin name works even in a config carrying no
# `version` key: containerd migrates the file from version 0 on load and keeps
# the qualified name. Verified with `containerd -c <file> config dump`, which
# is what `validate` runs below.
- name: Add containerd's registry config_path pointing at certs.d
  ansible.builtin.blockinfile:
    path: "{{ containerd_registry_trust_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK containerd_registry_trust"
    block: |
      [plugins."{{ containerd_registry_trust_cri_images_plugin }}".registry]
        config_path = "{{ containerd_registry_trust_certs_dir }}"
    owner: root
    group: root
    mode: "0644"
    validate: "containerd -c %s config dump"
  when: >-
    containerd_registry_trust_block_present | bool
    or not containerd_registry_trust_existing_table | bool
  notify: Restart containerd

- name: Repoint an existing registry config_path at certs.d
  ansible.builtin.replace:
    path: "{{ containerd_registry_trust_config_path }}"
    regexp: >-
      (?m)^(\s*\[plugins\.['"]?{{ containerd_registry_trust_cri_images_plugin | regex_escape }}['"]?\.registry\]\s*\n\s*config_path\s*=\s*)['"][^'"]*['"]
    replace: '\1''{{ containerd_registry_trust_certs_dir }}'''
    validate: "containerd -c %s config dump"
  when:
    - containerd_registry_trust_existing_table | bool
    - not containerd_registry_trust_block_present | bool
  notify: Restart containerd

# Neither branch above can report "I matched nothing", so confirm the effective
# config rather than trusting the edit. `containerd config dump` reads the file,
# which is exactly what is being checked here.
- name: Confirm containerd's config now points at certs.d
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail && containerd config dump
      | grep -A2 "\.registry\]"
      | grep -q "{{ containerd_registry_trust_certs_dir }}"
    executable: /bin/bash
  changed_when: false
  failed_when: false
  register: containerd_registry_trust_config_check

- name: Fail when the registry config_path could not be set
  ansible.builtin.fail:
    msg: >-
      {{ containerd_registry_trust_config_path }} still does not point
      containerd at {{ containerd_registry_trust_certs_dir }}, so pulls from
      {{ containerd_registry_trust_endpoint }} would be attempted over HTTPS
      and fail. Its [plugins...registry] table is in a layout this role
      doesn't recognise -- set config_path there by hand, or check that
      containerd_registry_trust_cri_images_plugin names the plugin your
      containerd version actually uses.
  when: containerd_registry_trust_config_check.rc != 0

# The reachability check below should see the config as containerd will.
- name: Apply any pending containerd restart before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify the registry is reachable from the node
  when: containerd_registry_trust_verify
  block:
    - name: Reach the registry from the node
      ansible.builtin.uri:
        url: "{{ containerd_registry_trust_url }}/v2/"
        status_code: [200, 401]
        timeout: "{{ containerd_registry_trust_verify_timeout }}"
      register: containerd_registry_trust_v2_check
      changed_when: false
      failed_when: false

    - name: Fail when the registry is required but unreachable
      ansible.builtin.fail:
        msg: >-
          {{ containerd_registry_trust_url }}/v2/ did not answer from
          {{ inventory_hostname }}
          ({{ containerd_registry_trust_v2_check.msg | default('no response') }}).
      when:
        - containerd_registry_trust_required
        - containerd_registry_trust_v2_check.status | default(0) not in [200, 401]

    - name: Warn when the registry is not answering yet
      ansible.builtin.debug:
        msg: >-
          containerd on {{ inventory_hostname }} is configured for
          {{ containerd_registry_trust_endpoint }}, but nothing answered at
          {{ containerd_registry_trust_url }}/v2/ yet. Start whatever serves
          that endpoint on {{ containerd_registry_trust_address }} -- the node
          side is done and needs no re-run once it's up.
      when: containerd_registry_trust_v2_check.status | default(0) not in [200, 401]

    - name: Report the registry the node can now pull from
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} can pull
          {{ containerd_registry_trust_endpoint }}/<name>:<tag> over plain HTTP.
      when: containerd_registry_trust_v2_check.status | default(0) in [200, 401]
