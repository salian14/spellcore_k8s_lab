---
# Cluster dashboards, delivered through the same sidecar mechanism an
# application would use: a labelled ConfigMap per dashboard in the observability
# namespace. Nothing here touches the Grafana release -- the sidecar's WATCH
# picks the ConfigMaps up and POSTs the provisioning reload API, so dashboards
# can be changed without a helm upgrade.

# 0755, not the 0700 used for the values directory: unlike those files these
# manifests contain no credentials.
- name: Ensure the dashboard manifest directory exists
  ansible.builtin.file:
    path: "{{ k8s_observability_dashboards_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# lookup('file', ...) inside the template reads from this role's files/
# directory on the CONTROLLER, so the JSON never has to be copied to the node
# separately -- it arrives embedded in the rendered manifest.
- name: Render the dashboard ConfigMap manifests
  ansible.builtin.template:
    src: dashboard-configmap.yaml.j2
    dest: "{{ k8s_observability_dashboards_dir }}/{{ item.name }}.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ k8s_observability_dashboards }}"
  loop_control:
    label: "{{ item.name }}"
  register: k8s_observability_dashboard_manifests

# Half of the idempotence gate below, same shape as the `helm status` guards in
# main.yml: a manifest that is already applied and unchanged is skipped, but one
# whose ConfigMap has been deleted out from under it is re-applied.
- name: List the dashboard ConfigMaps already in the cluster
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ k8s_observability_kubeconfig }}
    -n {{ k8s_observability_namespace }}
    get configmap
    -l {{ k8s_observability_grafana_sidecar_dashboards_label }}
    -o name
  register: k8s_observability_dashboard_existing
  changed_when: false
  failed_when: false

# --server-side, NOT a plain apply. Client-side apply stores a copy of the whole
# manifest in the last-applied-configuration annotation, which doubles the
# object size -- node-exporter-full at ~460KB would land at ~920KB against a
# 1MiB limit, and the next revision of that dashboard would push it over.
# --force-conflicts takes ownership back if a field was ever set by another
# manager (a hand-run kubectl edit, or an earlier client-side apply).
- name: Apply the dashboard ConfigMaps
  ansible.builtin.command: >-
    kubectl --kubeconfig={{ k8s_observability_kubeconfig }}
    apply --server-side --force-conflicts
    -f {{ k8s_observability_dashboards_dir }}/{{ item.item.name }}.yaml
  loop: "{{ k8s_observability_dashboard_manifests.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: k8s_observability_dashboard_apply
  # `apply --server-side` prints "serverside-applied" whether or not anything
  # actually differed -- there is no "unchanged" variant to match on -- so the
  # `when` gate below is what carries idempotence, not this.
  changed_when: true
  when: >-
    item.changed
    or ('configmap/grafana-dashboard-' ~ item.item.name)
       not in (k8s_observability_dashboard_existing.stdout_lines | default([], true))
