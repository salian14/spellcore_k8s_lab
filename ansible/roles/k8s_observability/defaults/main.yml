---
# --- kubeconfig and helm ---
k8s_observability_kubeconfig: /etc/kubernetes/admin.conf
k8s_observability_helm_binary: /usr/local/bin/helm
k8s_observability_helm_timeout: 10m

# Everything lands in one namespace, separate from application workloads. The
# collector's Service is still reachable cluster-wide -- see the ingest
# endpoint note at the bottom of this file.
k8s_observability_namespace: observability

# Rendered values files live here rather than /tmp because they contain the
# MinIO and Grafana credentials, and /tmp is world-readable. The directory is
# 0700 and the files inside are 0600.
k8s_observability_values_dir: /root/observability

# --- chart repositories ---
k8s_observability_helm_repos:
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: minio
    url: https://charts.min.io/
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

# --- chart versions ---
# Pinned so a re-provision six months from now deploys what was tested, not
# whatever is newest. Chart name is pinned alongside each version because of
# the tempo/tempo-distributed trap: both ship appVersion 2.9.0, but
# tempo-distributed is the microservices chart and would deploy eight separate
# components into a cluster with two schedulable nodes.
k8s_observability_minio_chart: minio/minio
k8s_observability_minio_chart_version: "5.4.0"

k8s_observability_tempo_chart: grafana/tempo
k8s_observability_tempo_chart_version: "1.24.4" # appVersion 2.9.0

k8s_observability_loki_chart: grafana/loki
k8s_observability_loki_chart_version: "7.3.0" # appVersion 3.6.12

k8s_observability_grafana_chart: grafana/grafana
k8s_observability_grafana_chart_version: "10.5.15" # appVersion 12.3.1

k8s_observability_otel_chart: open-telemetry/opentelemetry-collector
k8s_observability_otel_chart_version: "0.170.0" # appVersion 0.158.0

# The plain server chart, not kube-prometheus-stack. That one brings a
# CRD-installing operator, a second Grafana, and CRDs `helm upgrade` refuses to
# update -- none of which this lab wants. Same monolithic-chart reasoning as
# picking tempo over tempo-distributed above. kube-state-metrics and
# node-exporter come along as bundled subcharts; they are not separate releases.
k8s_observability_prometheus_chart: prometheus-community/prometheus
k8s_observability_prometheus_chart_version: "29.25.0" # appVersion v3.13.2

# --- credentials ---
# Plaintext on purpose. There is no vault in this repo, and this cluster sits on
# an isolated lab network reachable only from the workstation -- the
# same posture as lab_registry_scheme: "http" in group_vars/all.yml. To use
# different credentials, copy host_vars/k8s-control.yml.example to
# host_vars/k8s-control.yml and override them there rather than editing this
# file. Do not carry this pattern into anything that isn't a lab.
#
# MinIO's chart GENERATES these when left empty, which would silently rotate
# them on the second provisioning run and break Tempo and Loki with S3 auth
# errors. They must be set explicitly.
k8s_observability_minio_root_user: lab-minio
k8s_observability_minio_root_password: lab-observability
k8s_observability_grafana_admin_user: admin
k8s_observability_grafana_admin_password: lab-observability

# --- in-cluster service addresses ---
# Note the ports differ: Tempo's HTTP API is 3200, Loki's is 3100. Pointing
# Grafana's Tempo datasource at 3100 yields a datasource that saves without
# complaint and then returns no traces.
k8s_observability_minio_service: "minio.{{ k8s_observability_namespace }}.svc.cluster.local"
k8s_observability_tempo_service: "tempo.{{ k8s_observability_namespace }}.svc.cluster.local"
k8s_observability_loki_service: "loki.{{ k8s_observability_namespace }}.svc.cluster.local"
k8s_observability_tempo_http_port: 3200
k8s_observability_loki_http_port: 3100

# `prometheus-server`, not `prometheus`: this chart names the server Service
# <release>-server, and release "prometheus" therefore yields prometheus-server.
# There is no Service called plain `prometheus` -- pointing anything at that
# name resolves to nothing.
#
# Port 80, not 9090. 9090 is the container port; the chart's Service publishes
# it on servicePort 80. Same class of mistake as the Tempo 3200/3100 trap above.
k8s_observability_prometheus_service: "prometheus-server.{{ k8s_observability_namespace }}.svc.cluster.local"
k8s_observability_prometheus_http_port: 80

# --- object storage ---
k8s_observability_minio_pvc_size: 20Gi
k8s_observability_tempo_bucket: tempo
k8s_observability_loki_chunks_bucket: loki-chunks
k8s_observability_loki_ruler_bucket: loki-ruler

# --- retention ---
k8s_observability_tempo_retention: 72h
k8s_observability_loki_retention: 168h
k8s_observability_prometheus_retention: 15d

# How often every scrape target is polled. 30s rather than the chart's 15s
# halves both sample volume and CPU; nothing in this lab needs 15s resolution.
k8s_observability_prometheus_scrape_interval: 30s

# --- persistent volume sizes ---
# Tempo and Loki keep only WAL/local blocks here; flushed blocks live in MinIO.
k8s_observability_tempo_pvc_size: 10Gi
k8s_observability_loki_pvc_size: 10Gi
k8s_observability_grafana_pvc_size: 2Gi
# Unlike Tempo and Loki, this one is the whole of it: Prometheus has no S3
# backend, so nothing here is ever flushed to MinIO and the local volume is the
# only copy. Long-term metrics storage would mean Thanos or Mimir.
k8s_observability_prometheus_pvc_size: 20Gi
k8s_observability_storage_class: local-path

# --- collector ---
# chart 0.170.0 ships image.repository: "" and its NOTES.txt calls
# fail "[ERROR] 'image.repository' must be set." -- so unlike most charts there
# is no default to inherit and both of these are mandatory. command.name must
# match the distro's binary name.
#
# The otelcol-k8s distro is the small one and is sufficient: its release
# manifest includes otlpreceiver, k8seventsreceiver, k8sattributesprocessor,
# batch, memory_limiter and the otlp/otlphttp exporters. The much larger
# contrib image is not needed.
k8s_observability_otel_image_repository: otel/opentelemetry-collector-k8s
k8s_observability_otel_image_tag: "0.158.0"
k8s_observability_otel_command_name: otelcol-k8s

# --- Grafana exposure ---
# NodePort so the host browser can reach Grafana over the private network at
# http://192.168.56.10:30300 without an ingress controller or MetalLB, neither
# of which this cluster has. 30080 is already taken by fathom/fathom-agent.
# NodePorts answer on every node IP, so .11 and .12 work too.
k8s_observability_grafana_node_port: 30300
k8s_observability_grafana_url: "http://192.168.56.10:{{ k8s_observability_grafana_node_port }}"

# --- Prometheus exposure ---
# Its own NodePort as well as a Grafana datasource, because /targets is the page
# that answers "why is this metric missing?" and Grafana cannot show it. 30080
# is fathom/fathom-agent and 30300 is Grafana above, so 30090 it is.
k8s_observability_prometheus_node_port: 30090
k8s_observability_prometheus_url: "http://192.168.56.10:{{ k8s_observability_prometheus_node_port }}"

# --- Grafana sidecar (delegated dashboards and alerts) ---
# The chart ships a kiwigrid/k8s-sidecar container that watches ConfigMaps,
# writes their contents into Grafana's provisioning directories and POSTs the
# reload API. With searchNamespace ALL it watches the WHOLE cluster, so any
# application can ship its own dashboard as a labelled ConfigMap in its own
# namespace and have Grafana pick it up -- no Helm values change, no CRDs, no
# operator. That is the entire reason this is switched on.
#
# ALL requires cluster-scoped RBAC. The chart's `rbac.namespaced` defaults to
# false, which is what makes it create a ClusterRole over configmaps/secrets --
# do not set it true or the sidecar gets a namespaced Role and silently sees
# only the observability namespace.
k8s_observability_grafana_sidecar_search_namespace: "ALL"

# Presence of the label is what matches; the chart leaves `labelValue` empty, so
# the sidecar never compares the value. "1" is convention, not a requirement.
k8s_observability_grafana_sidecar_dashboards_label: grafana_dashboard
k8s_observability_grafana_sidecar_alerts_label: grafana_alert

# Which annotation names the Grafana folder a dashboard lands in. It only works
# alongside provider.foldersFromFilesStructure -- the sidecar writes each
# ConfigMap into <FOLDER>/<annotation value>/ and Grafana derives the folder
# name from the directory. Set one without the other and every dashboard ends up
# in General regardless of its annotation.
k8s_observability_grafana_sidecar_folder_annotation: grafana_folder

# Deliberately NOT setting the chart's `defaultFolderName`: it moves both the
# sidecar's FOLDER and the provider's path down to /tmp/dashboards/<name>, which
# still works but adds a level for no gain here. Left unset, an un-annotated
# ConfigMap lands in Grafana's General folder.

# --- bundled cluster dashboards ---
# Rendered as one ConfigMap per dashboard in the observability namespace and
# picked up by the sidecar above. These are the cluster's own dashboards; they
# use the same delegation mechanism an application would, on purpose, so the
# mechanism is exercised by the base install rather than only by whatever ships
# later.
#
# The JSON lives in files/dashboards/ and was fetched from grafana.com, then
# normalised: __inputs/__requires stripped (the import wizard consumes those and
# file provisioning never runs it), numeric `id` nulled, and each dashboard's
# datasource variable pinned to the `prometheus` UID -- without that last step
# they resolve to Grafana's DEFAULT datasource, which in this stack is Tempo.
#
# `source` is recorded so a refresh is reproducible:
#   curl -sL https://grafana.com/api/dashboards/<id>/revisions/latest/download
k8s_observability_dashboards_dir: /root/observability/dashboards
k8s_observability_dashboards:
  - name: k8s-views-global
    folder: Kubernetes
    source: "grafana.com/dashboards/15757 rev 43"
  - name: k8s-views-namespaces
    folder: Kubernetes
    source: "grafana.com/dashboards/15758 rev 46"
  - name: k8s-views-nodes
    folder: Kubernetes
    source: "grafana.com/dashboards/15759 rev 40"
  - name: k8s-views-pods
    folder: Kubernetes
    source: "grafana.com/dashboards/15760 rev 39"
  - name: k8s-system-api-server
    folder: Kubernetes
    source: "grafana.com/dashboards/15761 rev 21"
  - name: k8s-system-coredns
    folder: Kubernetes
    source: "grafana.com/dashboards/15762 rev 22"
  - name: node-exporter-full
    folder: Nodes
    source: "grafana.com/dashboards/1860 rev 45"
