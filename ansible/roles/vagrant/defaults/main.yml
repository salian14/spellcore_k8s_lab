---
# User for whom the vagrant-libvirt plugin is installed and whose ~/.bashrc
# gets VAGRANT_DEFAULT_PROVIDER set. Vagrant plugins are per-user.
vagrant_user: "{{ ansible_user_id }}"

vagrant_prerequisite_packages:
  - curl
  - gpg

vagrant_hashicorp_gpg_key_url: https://apt.releases.hashicorp.com/gpg
vagrant_hashicorp_keyring: /usr/share/keyrings/hashicorp-archive-keyring.gpg
vagrant_hashicorp_repo: "deb [signed-by={{ vagrant_hashicorp_keyring }}] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"

vagrant_package: vagrant

# Set to false to install vagrant only, without the libvirt provider.
vagrant_install_libvirt_provider: true
vagrant_default_provider: libvirt

vagrant_libvirt_packages:
  - qemu-system-x86
  - libvirt-daemon-system
  - libvirt-clients
  - libvirt-dev
  - ebtables
  - dnsmasq-base
  - libxslt1-dev
  - libxml2-dev
  - wget
  - bridge-utils

# Group membership needed for the user to talk to libvirtd without sudo.
vagrant_manage_libvirt_group_membership: true
vagrant_libvirt_groups:
  - libvirt
  - kvm

# libvirt storage pool that backs VM disk images for the vagrant-libvirt
# provider. Left at the libvirt defaults, this is a no-op; if the pool
# doesn't exist yet it's created at this path, if it already exists at a
# different path the role refuses to touch it rather than risk data loss.
vagrant_libvirt_storage_pool_name: default
vagrant_libvirt_storage_pool_path: /var/lib/libvirt/images

# Where Vagrant itself keeps downloaded boxes, plugins, and machine state.
# Leave empty to keep Vagrant's own default (~/.vagrant.d).
vagrant_home: ""

# Installs the vagrant-hostmanager plugin, which keeps /etc/hosts on the
# host and each guest in sync with every machine's name/IP so they're all
# resolvable by hostname. Needs config.hostmanager.enabled/manage_host set
# in the Vagrantfile itself to actually take effect.
vagrant_install_hostmanager_plugin: true

# Deploys a sudoers.d drop-in granting vagrant_hostmanager_sudo_group
# passwordless sudo for exactly the `cp` command vagrant-hostmanager uses
# to update the host's /etc/hosts, so `vagrant up`/`reload` don't prompt
# for a password. Set to false to leave sudo prompting in place.
vagrant_hostmanager_manage_sudoers: true

# Group granted the passwordless sudo rule above. Usually "sudo" on
# Debian/Ubuntu, "wheel" on Fedora/RHEL. vagrant_user must be a member.
vagrant_hostmanager_sudo_group: sudo
