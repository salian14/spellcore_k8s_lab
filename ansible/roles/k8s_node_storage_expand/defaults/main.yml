---
# --- target volume ---
# Ubuntu's cloud images partition the whole disk into an LVM PV but only carve
# a portion of it into the root LV, leaving the rest of the volume group free.
# On generic/ubuntu2204 that is a 128G vda -> 126G vda3 PV -> 63G root LV, so
# roughly half the disk sits unallocated. These are the stock Ubuntu names.
k8s_node_storage_expand_vg: ubuntu-vg
k8s_node_storage_expand_lv: ubuntu-lv
k8s_node_storage_expand_lv_path: "/dev/{{ k8s_node_storage_expand_vg }}/{{ k8s_node_storage_expand_lv }}"

# How much of the free volume group space to claim. The default takes all of
# it; set something like "+32G" instead to leave room for a future separate LV
# (a dedicated /var/lib/containerd, say), because +100%FREE forecloses that.
k8s_node_storage_expand_extents: "+100%FREE"

# Don't bother resizing for trivial amounts of free space. Also what makes the
# role idempotent: after the first run vg_free is 0, which is below this, so
# the lvextend task skips instead of failing on "no free extents".
k8s_node_storage_expand_min_free_bytes: 1073741824 # 1 GiB
