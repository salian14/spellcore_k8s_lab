---
# Lab network facts shared by every play in this repo. This file is the source
# of truth for addresses on the Ansible side; the `nodes` map in
# ../terraform/variables.tf wins for node addresses if the two ever disagree.
# The full map is in ../README.md under "Networking".

# The host's address on the lab network (the NAT bridge), reachable from every
# node. Must match `host_ip` in ../terraform/variables.tf.
lab_host_ip: "192.168.56.1"

# The local OCI registry the cluster pulls from. The k8s_node_hosts role syncs
# the node names into each guest's /etc/hosts, but it only knows about nodes in
# the inventory and this name points at the host -- so
# containerd_registry_trust writes it into /etc/hosts on each node itself.
#
# Use the name, not localhost: it resolves to the same address on the host and
# on the nodes, so a tag baked into an image stays valid in both places.
lab_registry_host: "registry.lab"
lab_registry_port: 5000
lab_registry_endpoint: "{{ lab_registry_host }}:{{ lab_registry_port }}"
# Plain HTTP, no auth -- a lab registry on an isolated bridge.
lab_registry_scheme: "http"
lab_registry_url: "{{ lab_registry_scheme }}://{{ lab_registry_endpoint }}"
