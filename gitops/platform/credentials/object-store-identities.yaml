# Every S3 identity the object store knows about -- the server side of the
# credentials. Each consumer holds its own copy of its pair in its own
# namespace (gitops/observability/credentials/object-store-credentials.yaml is
# the observability stack's); the two have to agree, exactly as they would
# with any real S3 provider that has your key on file. This file is where a
# pair is issued or rotated; the consumer's copy follows.
#
# Plaintext on purpose. There is no vault, no sealed-secrets and no SOPS in
# this repo, and this cluster sits on an isolated lab network reachable only
# from the workstation -- the same posture as lab_registry_scheme: "http" in
# ansible/group_vars/all.yml. Do not carry this pattern into anything that
# isn't a lab; this file is the one to replace with a SealedSecret or a
# SOPS-encrypted manifest when that day comes, and nothing else needs to change.
#
# TENANTS: one access/secret pair per consumer, named after it, plus the admin
# pair. The Deployment's init container turns these into SeaweedFS's identity
# file and scopes each consumer to its buckets there.
apiVersion: v1
kind: Secret
metadata:
  name: object-store-identities
  namespace: platform
type: Opaque
stringData:
  # Unscoped. For a human with `aws --endpoint-url` or `weed shell`; nothing
  # in the cluster uses it.
  admin-access-key: object-store-admin
  admin-secret-key: lab-object-store
  # The observability stack: tempo, loki-chunks, loki-ruler.
  observability-access-key: observability
  observability-secret-key: lab-observability
