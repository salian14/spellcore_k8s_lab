# Wave 0: the Secrets everything else reads its credentials from -- this
# stack's identity on the platform object store, and Grafana's admin login.
# First, because Tempo, Loki and Grafana all fail to start without them, and
# because this is also the Application that creates the namespace.
{{ include "observability.directoryApplication" (dict
  "root" .
  "name" "credentials"
  "wave" 0
  "path" "gitops/observability/credentials") }}
