# This stack's identity on the platform object store -- the CLIENT side of the
# credentials. The server side is the matching pair in
# gitops/platform/credentials/object-store-identities.yaml, where it is scoped
# to this stack's buckets (tempo, loki-chunks, loki-ruler); the two have to
# agree. Rotate there first, then here.
#
# Plaintext for the same reason as everything under credentials/ in this repo:
# no vault, no sealed-secrets, no SOPS, and an isolated lab network. See the
# note in the platform identities file. Do not carry the pattern anywhere
# that isn't a lab.
#
# Read by Tempo and Loki as environment variables, expanded into their config
# files by -config.expand-env (see values/tempo.yaml and values/loki.yaml).
# The names are our own: nothing here uses the AWS SDK's credential chain, so
# they are deliberately NOT AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY -- a
# name the SDK would pick up implicitly is a name that can surprise.
apiVersion: v1
kind: Secret
metadata:
  name: object-store-credentials
  namespace: observability
type: Opaque
stringData:
  access-key: observability
  secret-key: lab-observability
