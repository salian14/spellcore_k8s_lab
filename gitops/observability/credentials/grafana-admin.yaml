# Grafana's admin login. Plaintext for the same reason as
# object-store-credentials.yaml -- see the note there.
#
# Consumed through the chart's `admin.existingSecret` (values/grafana.yaml),
# which is the sanctioned route. Do NOT instead set security.admin_password
# under grafana.ini: the chart's assertNoLeakedSecrets helper aborts the render
# when a sensitive key appears in plaintext there.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: lab-observability
